# Every push: typecheck, lint, unit tests. The same three commands as on a laptop.
# No secrets are given to this job, on purpose: `pnpm test` runs with the network blocked
# (@repo/config/test-offline) and must never need a key or a database. A test that does is a bug.
# `pnpm smoke` (live DB) is not run here — it is run by hand, with the user's go.
name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # A critical advisory in a production dependency fails the build. Next.js 15.5.25 carried an
      # unauthenticated RCE for weeks with every check above green; this is the check that would have said so.
      - run: pnpm audit --prod --audit-level=critical

  # A key committed anywhere in history fails the build (PLATFORM-PLAN 0.5). The binary is pinned by checksum
  # rather than the gitleaks action, which needs a paid licence once the repo moves to an organisation.
  # Reviewed false positives live in .gitleaksignore, one fingerprint each.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks, whole history
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --log-level warn .
