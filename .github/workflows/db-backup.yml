# Encrypted off-site backup of the production database every 6 hours (PLATFORM-PLAN 0.4).
# Off until the repository variable BACKUP_ENABLED is "true", so it never runs before its secrets exist.
# The job holds only the age PUBLIC key: it can write backups, never read them. Setup: docs/DEPLOY.md, "Backups".
name: Database backup

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # AWS role via OIDC: no long-lived AWS keys in GitHub

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: pg_dump 17 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BACKUP_AWS_ROLE_ARN }}
          aws-region: ap-southeast-4
      - name: Dump, encrypt, upload
        run: PATH="/usr/lib/postgresql/17/bin:$PATH" bash scripts/db-backup.sh
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_URI: ${{ vars.BACKUP_S3_URI }}
          HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
